name: Deploy Frontend to S3 + CloudFront

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
          

      - name: Install deps
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build   # => dist 생성

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-northeast-2

      - name: Check AWS CLI
        run: aws --version

      - name: Sync hashed assets with long cache
        run: >
          aws s3 sync dist s3://${{ secrets.S3_BUCKET }}
          --delete
          --exclude "uploads/*"
          --exclude "index.html"
          --exclude "assets/*.map"
          --cache-control "public, max-age=31536000, immutable"

      - name: Upload index.html with short cache
        run: |
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Remove sourcemaps from S3 (optional)
        run: |
          aws s3 rm s3://${{ secrets.S3_BUCKET }}/assets/ --recursive --exclude "*" --include "*.map" || true

      - name: Invalidate CloudFront
        env:
          DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "$DIST_ID" ]; then
            echo "CLOUDFRONT_DISTRIBUTION_ID is missing or not accessible"
            exit 1
          fi
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
